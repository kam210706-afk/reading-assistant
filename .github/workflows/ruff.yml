name: Code Quality

on:
  push:
    branches: [task2]
  pull_request:
    branches: [main]

jobs:
  ruff:
    name: Ruff Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check src